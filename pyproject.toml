[project]
name = "eda-diabetes"
version = "0.1.0"
description = "A minimal EDA process for Diabetes 130-US Hospitals for Years 1999-2008 dataset. "
readme = "README.md"
authors = [
    { name = "Rayhan Atmadja", email = "workspace.rayhanatmadja@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "ucimlrepo>=0.0.7",
]

[project.scripts]
eda-diabetes = "eda_diabetes:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbstripout>=0.9.1",
    "pre-commit>=4.7.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
